<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Pagelapse: see how any web page looked and changed over the years. Web archive captures, meaningful changes only, on one scrubbable timeline."
    />
    <meta name="application-name" content="Pagelapse" />
    <meta property="og:title" content="Pagelapse: see how any web page changed over the years" />
    <meta property="og:site_name" content="Pagelapse" />
    <meta property="og:description" content="Scrub a decade of a web page's edits in a minute, from web archive captures." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pagelapse.geekplux.com/" />
    <meta property="og:image" content="https://pagelapse.geekplux.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pagelapse: see how any web page changed over the years" />
    <!-- og:video: the same card, moving (1200 × 630, silent H.264). Platforms that play it
         (iMessage, Discord) show it; the rest show og:image. -->
    <meta property="og:video" content="https://pagelapse.geekplux.com/og.mp4" />
    <meta property="og:video:secure_url" content="https://pagelapse.geekplux.com/og.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1200" />
    <meta property="og:video:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://pagelapse.geekplux.com/" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <!-- A stored light / dark choice, set before the stylesheet applies (public/theme.js; no inline script under the CSP). -->
    <script src="/theme.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/SchibstedGrotesk-Variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Pagelapse: see how any web page changed over the years</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
