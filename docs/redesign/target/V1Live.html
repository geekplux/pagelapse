.pl{font-family:'Schibsted Grotesk',system-ui,sans-serif;font-size:14px;line-height:20px;color:var(--sand-12);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:'ss01'}
.pl.light{--sand-1:#fdfdfc;--sand-2:#f9f9f8;--sand-3:#f1f0ef;--sand-4:#e9e8e6;--sand-5:#e2e1de;--sand-6:#dad9d6;--sand-7:#cfceca;--sand-8:#bcbbb5;--sand-9:#8d8d86;--sand-10:#82827c;--sand-11:#63635e;--sand-12:#21201c;--cyan-1:#fafdfe;--cyan-2:#f2fafb;--cyan-3:#def7f9;--cyan-4:#caf1f6;--cyan-5:#b5e9f0;--cyan-6:#9ddde7;--cyan-7:#7dcedc;--cyan-8:#3db9cf;--cyan-9:#00a2c7;--cyan-10:#0797b9;--cyan-11:#107d98;--cyan-12:#0d3c48;--amber-1:#fefdfb;--amber-2:#fefbe9;--amber-3:#fff7c2;--amber-4:#ffee9c;--amber-5:#fbe577;--amber-6:#f3d673;--amber-7:#e9c162;--amber-8:#e2a336;--amber-9:#ffc53d;--amber-10:#ffba18;--amber-11:#ab6400;--amber-12:#4f3422;--bg:#fff;--logo-ground:#fff;--logo-ink:#21201c;--frame:#fff}
.pl.dark{--sand-1:#111110;--sand-2:#191918;--sand-3:#222221;--sand-4:#2a2a28;--sand-5:#31312e;--sand-6:#3b3a37;--sand-7:#494844;--sand-8:#62605b;--sand-9:#6f6d66;--sand-10:#7c7b74;--sand-11:#b5b3ad;--sand-12:#eeeeec;--cyan-1:#0b161a;--cyan-2:#101b20;--cyan-3:#082c36;--cyan-4:#003848;--cyan-5:#004558;--cyan-6:#045468;--cyan-7:#12677e;--cyan-8:#11809c;--cyan-9:#00a2c7;--cyan-10:#23afd0;--cyan-11:#4ccce6;--cyan-12:#b6ecf7;--amber-1:#16120c;--amber-2:#1d180f;--amber-3:#302008;--amber-4:#3f2700;--amber-5:#4d3000;--amber-6:#5c3d05;--amber-7:#714f19;--amber-8:#8f6424;--amber-9:#ffc53d;--amber-10:#ffd60a;--amber-11:#ffca16;--amber-12:#ffe7b3;--bg:var(--sand-1);--logo-ground:#191918;--logo-ink:#eeeeec;--frame:var(--sand-2)}
.pl *{box-sizing:border-box}
:where(.pl) a{color:inherit;text-decoration:none}
:where(.pl) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-feature-settings:'zero' 0}
.wrap{width:1200px;margin:0 auto}
.s12{font-size:12px;line-height:16px}.s14{font-size:14px;line-height:20px}.s20{font-size:20px;line-height:28px;letter-spacing:-.005em}.s32{font-size:32px;line-height:40px;letter-spacing:-.02em}
.dim{color:var(--sand-11)}.w5{font-weight:500}.w6{font-weight:600}.w7{font-weight:700}
.hair{border:0;border-top:.5px solid var(--sand-6);margin:0}
/* header */
.top{height:72px;display:flex;align-items:center;gap:32px;border-bottom:.5px solid var(--sand-6)}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.02em}
.find{flex:0 0 520px;margin-left:auto;display:flex;gap:8px}
.field{flex:1;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border:.5px solid var(--sand-8);border-radius:8px;background:var(--bg);color:var(--sand-11)}
.field input{all:unset;flex:1;color:var(--sand-12);font-size:14px}
.field input::placeholder{color:var(--sand-10)}
.btn{height:40px;padding:0 16px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.btn.solid{background:var(--sand-12);color:var(--sand-1)}
.btn.line{border:.5px solid var(--sand-8);background:var(--bg)}
.btn.icon{width:40px;padding:0;justify-content:center}
.btn.quiet{padding:0 8px;color:var(--sand-11)}
.ghl{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;color:var(--sand-11)}
/* title */
.head{padding-top:40px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px}
.head h1{margin:0;font-weight:700}
.meta{display:flex;gap:20px;margin-top:4px;color:var(--sand-11);align-items:center}
.meta b{color:var(--sand-12);font-weight:500}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;background:var(--sand-3);color:var(--sand-11);font-size:12px;line-height:16px}
.samples{display:flex;gap:4px}
.samples a{height:32px;display:inline-flex;align-items:center;padding:0 10px;border-radius:6px;color:var(--sand-11)}
.samples a[aria-current]{background:var(--sand-3);color:var(--sand-12);font-weight:500}
/* stage */
.stage{margin-top:24px;position:relative;border-radius:8px;overflow:hidden;border:.5px solid var(--sand-7);background:var(--frame)}
.stage img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.layer{position:absolute;inset:0}
.divider{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.35)}
.knob{position:absolute;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:20px;background:#fff;color:#21201c;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.18)}
.ptag{position:absolute;top:12px;height:28px;display:inline-flex;align-items:center;gap:8px;padding:0 10px;border-radius:6px;background:var(--bg);box-shadow:0 0 0 .5px var(--sand-7);font-size:14px}
.ptag .k{font-weight:600}
.before{color:var(--cyan-11)}.after{color:var(--amber-11)}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px}
.dot.b{box-shadow:inset 0 0 0 1.5px var(--cyan-11)}.dot.a{background:var(--amber-11)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
.pair .cap{display:flex;align-items:center;gap:8px;height:28px;margin-bottom:8px}
.pair .stage{margin-top:0}
/* controls */
.ctrl{margin-top:16px;display:flex;align-items:center;justify-content:space-between}
.grp{display:flex;align-items:center;gap:8px}
.step{display:flex;align-items:center;gap:4px}
.step .lab{min-width:132px;text-align:center}
.seg{display:inline-flex;padding:2px;gap:2px;border-radius:8px;background:var(--sand-3);height:40px}
.seg button{height:36px;padding:0 14px;border-radius:6px;color:var(--sand-11)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--sand-12);font-weight:500;box-shadow:0 0 0 .5px var(--sand-7)}
/* ribbon */
.ribbon{margin-top:40px;position:relative}
.strip{display:flex;gap:8px}
.th{flex:1;aspect-ratio:16/10;border-radius:4px;overflow:hidden;position:relative;background:var(--sand-3);box-shadow:0 0 0 .5px var(--sand-7)}
.th img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.th.triv img{opacity:.45}
.th.b{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--cyan-11)}
.th.a{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--amber-11)}
.th.hov{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--sand-12)}
.ribbon svg{display:block;overflow:visible}
.cv{fill:none;stroke:var(--sand-8);stroke-width:.5}
.cv.b{stroke:var(--cyan-11);stroke-width:1}.cv.a{stroke:var(--amber-11);stroke-width:1}
.bar{fill:var(--sand-9)}.bar.a{fill:var(--amber-11)}
.ax{stroke:var(--sand-8);stroke-width:.5}
.yr{font:12px/1 'IBM Plex Mono',monospace;fill:var(--sand-11)}
.span{fill:var(--sand-3)}
.tip{position:absolute;transform:translate(-50%,-100%);padding:6px 10px;border-radius:6px;background:var(--sand-12);color:var(--sand-1);white-space:nowrap;font-size:12px;line-height:16px}
/* change */
.change{margin-top:56px;padding-top:40px;border-top:.5px solid var(--sand-6);display:grid;grid-template-columns:376px 1fr;gap:64px}
.when{display:flex;flex-direction:column;gap:4px}
.when div{display:flex;align-items:center;gap:8px}
.summary{margin:20px 0 10px;font-weight:600}
.facts{margin:32px 0 0;display:grid;grid-template-columns:128px 1fr;row-gap:12px;column-gap:16px}
.facts dt{color:var(--sand-11)}.facts dd{margin:0}
.num{font-family:'IBM Plex Mono',monospace;font-weight:500}
.links{margin-top:32px;display:flex;flex-direction:column;gap:8px}
.links a{display:inline-flex;align-items:center;gap:6px;color:var(--sand-11);text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:3px}
.diff{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 1fr;padding:7px 12px 7px 0;font-size:14px;line-height:22px}
.row .m{font-family:'IBM Plex Mono',monospace;text-align:center;color:var(--sand-9)}
.row.r-add{background:var(--amber-2)}.row.r-add .m{color:var(--amber-11)}
.row.r-del{background:var(--cyan-2)}.row.r-del .m{color:var(--cyan-11)}.row.r-del .tx{color:var(--sand-11)}
.row.r-mod .m{color:var(--sand-12)}
.row.r-eq .tx{color:var(--sand-11)}
.row.h .tx{font-weight:600}
.row.h.r-eq .tx{color:var(--sand-12)}
.ins{background:var(--amber-4);text-decoration:underline;text-decoration-color:var(--amber-11);text-underline-offset:3px;border-radius:2px}
.del{background:var(--cyan-3);text-decoration:line-through;text-decoration-color:var(--cyan-11);color:var(--sand-11);border-radius:2px}
.gap{display:flex;align-items:center;gap:8px;height:36px;padding-left:28px;color:var(--sand-11)}
.gap:before{content:'';position:absolute}
.more{margin-top:16px;padding-left:28px}
/* list of changes */
.every{margin-top:72px}
.every h2,.change h2{margin:0}
.tbl{margin-top:16px}
.tr{display:grid;grid-template-columns:200px 140px 1fr;gap:24px;align-items:center;min-height:48px;padding:10px 12px;border-top:.5px solid var(--sand-6)}
.tr.on{background:var(--sand-2)}
.mag{display:flex;align-items:center;gap:8px}
.mag i{display:block;height:4px;border-radius:2px;background:var(--sand-9)}
.tr.on .mag i{background:var(--amber-11)}
.tfoot{border-top:.5px solid var(--sand-6);padding:14px 12px;display:flex;gap:8px;color:var(--sand-11)}
.tfoot button{white-space:nowrap;text-decoration:underline;text-decoration-thickness:.5px;text-underline-offset:3px;color:var(--sand-12)}
/* footer */
.foot{margin-top:96px;border-top:.5px solid var(--sand-6);padding:40px 0 48px}
.fgrid{display:grid;grid-template-columns:1fr auto;gap:48px}
.fl{display:flex;flex-direction:column;gap:12px}
.more-by{display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.more-by nav{display:flex;gap:24px}
.more-by a{color:var(--sand-11)}.more-by a:first-child{color:var(--sand-12);font-weight:500}
.keys{display:flex;gap:20px;color:var(--sand-11)}
kbd{font:12px/16px 'IBM Plex Mono',monospace;padding:1px 5px;border-radius:4px;background:var(--sand-3);color:var(--sand-12);margin-right:6px}
.prog{height:2px;background:var(--sand-4);border-radius:1px;overflow:hidden;width:240px}
.prog i{display:block;height:100%;background:var(--sand-12)}
/* phone */
.ph .wrap{width:auto;margin:0 16px}
