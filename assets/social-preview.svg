<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Pagelapse: see how any web page changed over the years</title>
  <desc id="d">The Pagelapse mark and name with the headline beside a before/after split of the Wikipedia article "Internet Archive": the capture of 25 April 2018 on the left, the capture of 10 February 2026 on the right, with a divider between them.</desc>
  <!-- Rendered to assets/social-preview.png by scripts/render-social.ts (fonts and pictures are inlined there).
       Colours are Radix sand, cyan and amber (src/design/palette.ts); type is Schibsted Grotesk and IBM Plex Mono. -->
  <style>
    @font-face { font-family: "Schibsted Grotesk"; src: url("../public/fonts/SchibstedGrotesk-Variable-latin.woff2") format("woff2"); font-weight: 400 700; }
    @font-face { font-family: "IBM Plex Mono"; src: url("../public/fonts/IBMPlexMono-Regular-latin.woff2") format("woff2"); font-weight: 400; }
    .ui { font-family: "Schibsted Grotesk", system-ui, sans-serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d3c48"/><stop offset=".7" stop-color="#2d3a3c"/><stop offset="1" stop-color="#5a3a1e"/></linearGradient>
    <clipPath id="stage"><rect x="588" y="104" width="632" height="395" rx="8"/></clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1280" height="640" fill="#FFFFFF"/>

  <!-- Logo A, Sun path (src/design/Logo.tsx), 64 px, and the name in 700 -->
  <g transform="translate(72 96) scale(2.6667)">
    <rect x="1" y="1" width="22" height="22" rx="5.5" fill="url(#sky)"/>
    <circle cx="5.4" cy="16.2" r="1.25" fill="#3db9cf"/><circle cx="7.6" cy="10.9" r="1.5" fill="#7dcedc"/><circle cx="12" cy="8.2" r="1.8" fill="#f3d673"/><circle cx="16.4" cy="10.9" r="2.1" fill="#ffc53d"/><circle cx="18.6" cy="16.2" r="2.45" fill="#ff9d2e"/>
    <path d="M1 18.6h22" stroke="#fefdfb" stroke-width="1" opacity=".9"/>
    <rect x="1" y="18.6" width="22" height="4.4" fill="#21201c" opacity=".55" clip-path="inset(0 round 0 0 5.5 5.5)"/>
  </g>
  <text class="ui" x="156" y="142" font-size="40" font-weight="700" letter-spacing="-0.8" fill="#21201C">Pagelapse</text>

  <!-- Headline and lede -->
  <text class="ui" font-size="48" font-weight="700" letter-spacing="-1.2" fill="#21201C">
    <tspan x="72" y="282">See how any</tspan>
    <tspan x="72" y="340">web page changed</tspan>
    <tspan x="72" y="398">over the years.</tspan>
  </text>
  <text class="ui" font-size="24" fill="#63635E">
    <tspan x="72" y="458">Captures from the Internet Archive,</tspan>
    <tspan x="72" y="490">meaningful changes only.</tspan>
  </text>
  <text class="mono" x="72" y="568" font-size="20" fill="#63635E">github.com/geekplux/pagelapse</text>

  <!-- The stage: Before (2018) under After (2026), After shown right of the divider (the default sample's decade compare) -->
  <g clip-path="url(#stage)">
    <rect x="588" y="104" width="632" height="395" fill="#FFFFFF"/>
    <image x="588" y="104" width="632" height="395" preserveAspectRatio="xMidYMin slice" href="../public/samples/wikipedia-internet-archive/20180425033645-88cba648.webp"/>
    <svg x="904" y="104" width="316" height="395" viewBox="480 0 480 600" preserveAspectRatio="xMinYMin slice">
      <image width="960" height="600" href="../public/samples/wikipedia-internet-archive/20260210204802-8fe2b256.webp"/>
    </svg>
  </g>
  <rect x="588" y="104" width="632" height="395" rx="8" fill="none" stroke="#CFCECA" stroke-width="1"/>
  <!-- Divider (white, with a dark hairline) and knob -->
  <rect x="902.5" y="104" width="3" height="395" fill="#FFFFFF" stroke="#000000" stroke-opacity=".35" stroke-width=".5"/>
  <circle cx="904" cy="301.5" r="22" fill="#FFFFFF" filter="url(#lift)"/>
  <path d="M900 293.5 892 301.5l8 8M908 293.5l8 8-8 8" fill="none" stroke="#21201C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tags: ring dot + Before in cyan-11, filled dot + After in amber-11, each with its date (never colour alone) -->
  <g class="ui" font-size="20">
    <rect x="604" y="120" width="237" height="40" rx="6" fill="#FFFFFF" filter="url(#lift)"/>
    <circle cx="624" cy="140" r="5" fill="none" stroke="#107D98" stroke-width="2"/>
    <text x="638" y="147" font-weight="600" fill="#107D98">Before</text>
    <text class="mono" x="712" y="147" font-size="18" fill="#21201C">25 Apr 2018</text>
    <rect x="976" y="120" width="228" height="40" rx="6" fill="#FFFFFF" filter="url(#lift)"/>
    <circle cx="996" cy="140" r="6" fill="#AB6400"/>
    <text x="1010" y="147" font-weight="600" fill="#AB6400">After</text>
    <text class="mono" x="1072" y="147" font-size="18" fill="#21201C">10 Feb 2026</text>
  </g>
  <text class="ui" x="588" y="540" font-size="20" fill="#63635E">Wikipedia: Internet Archive, 2018 and 2026</text>
</svg>
