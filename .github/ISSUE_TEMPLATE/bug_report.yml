name: Bug report
description: Something in Pagelapse is broken or hard to use.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not report security problems here; see SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or sample
      description: The URL you looked up, or the built-in sample. A Pagelapse link copied from the address bar is ideal.
      placeholder: https://example.org/about
  - type: dropdown
    id: area
    attributes:
      label: Where in Pagelapse?
      options:
        - Pictures or compare modes
        - Timeline or filmstrip
        - Text diff or summaries
        - Live lookup (pasting a URL)
        - Keyboard, screen reader or other accessibility
        - Something else
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on a laptop; Safari on an iPhone with VoiceOver
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, or steps to reproduce.
