# One-off: records the NASA and Creative Commons samples and re-pictures Wikipedia from Arquivo.pt on a GitHub
# runner (system Chrome is preinstalled), then commits the fixtures and pictures back to this branch.
# Runs only for a push to the recording branch whose commit message contains [record]. Removed before merge.
name: Record samples

on:
  push:
    branches: [claude/project-thread-jw5zc1-9-record]

permissions:
  contents: write

concurrency:
  group: record-samples
  cancel-in-progress: false

jobs:
  record:
    if: contains(github.event.head_commit.message, '[record]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm record:new 2>&1 | tee record.log
        shell: bash
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: record-log
          path: record.log
      - name: Commit the recorded samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/samples public/samples
          git diff --cached --quiet && { echo "nothing recorded"; exit 1; }
          git commit -m "samples: record NASA and Creative Commons, re-picture Wikipedia (Arquivo.pt, GitHub runner)"
          git push
